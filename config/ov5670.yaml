# OmniVision OV5670, camera module 4BF523T2 (Dell Latitude 7275).
# Colour data decoded from the OEM Intel CPFF tuning file OV5670_4BF523T2_SKY.cpf
# shipped with the Dell "Intel 2D Imaging Driver" 30.10154.6618.148 (2015).
version: 1
algorithms:
  - Af:
  - Agc:
      # Mean luminance target (default 0.16). The video pipe applies a fixed
      # tone curve (~gamma 1.6) that ignores the ToneMapping LUT, so this is
      # the brightness knob. 0.36 matches a Surface Pro 7+ reference shot.
      relativeLuminanceTarget: 0.36
  - Awb:
      # Grey world gains blended 50/50 with the OEM white point locus below,
      # which also gives the colour temperature that selects the CCM.
      # Measured 2026-09-03 in daylight: scene mean and white wall both sit
      # on the locus once the black level is right.
      locusWeight: 0.5
      # Keep the algorithm running in dim scenes (default 16).
      minGreenLevel: 4
      # No pedestal left in the statistics with blackLevel 128 below.
      statsOffset: 0
      # Image path needs 16% more red gain than the statistics suggest
      # (wall neutral at U=V=128 with gains 1.65/1.76 vs 1.38/1.80 computed;
      # red lowered to 1.08 once lens shading was on, 2026-09-03).
      gainCorrection: [1.08, 0.98]
      # logZones: true   # per-zone ratios at debug level, tuning aid
      whitePoints:
        - ct: 2676
          rpg: 0.9072
          bpg: 0.4160
        - ct: 3029
          rpg: 0.8418
          bpg: 0.4541
        - ct: 4184
          rpg: 0.6787
          bpg: 0.5684
        - ct: 5010
          rpg: 0.5977
          bpg: 0.6416
        - ct: 5453
          rpg: 0.5615
          bpg: 0.6787
        - ct: 5962
          rpg: 0.5264
          bpg: 0.7178
        - ct: 6661
          rpg: 0.4844
          bpg: 0.7695
