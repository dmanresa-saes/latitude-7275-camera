      # ImgU obgrid units are half a 10-bit LSB: 128 == sensor black 64.
      # Measured: with 64 the statistics keep a ~9/255 pedestal, with 128 it
      # is gone, with 192 dark zones clip to zero.
      blackLevel: 128
      # blackLevel: 64  # ImgU optical black; OEM data says 63 at 10 bit
